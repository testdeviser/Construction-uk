# Builds the React site and uploads it to the live server over FTP
# every time something is pushed or merged into `main`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.tdcatalog.com
#   FTP_USERNAME  the FTP account used in FileZilla
#   FTP_PASSWORD  that account's password
#
# Optional repository variables (same page, "Variables" tab):
#   FTP_SERVER_DIR  folder on the server, default /construction-uk/
#   FTP_PROTOCOL    ftp or ftps, default ftp

name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/construction-uk/' }}
          # Only uploads changed files. Files on the server that this
          # workflow never uploaded (e.g. html-version/) are left alone.
